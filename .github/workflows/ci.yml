name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

env:
  DOCKERHUB_IMAGE: antlac1/termix-aws-sync

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t termix-aws-sync:ci .

      - name: Verify bundled CLI versions
        # The image's ENTRYPOINT is dedicated to termix-aws-sync itself (see
        # docker/entrypoint.sh), so aws/termix are checked via --entrypoint.
        run: |
          docker run --rm --entrypoint aws termix-aws-sync:ci --version
          docker run --rm --entrypoint termix termix-aws-sync:ci --version
          docker run --rm termix-aws-sync:ci --version

  publish:
    name: publish to Docker Hub
    # Only on version tags, and only once lint/tests/docker-build have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: antlac1
          # Repo secret: a Docker Hub access token (Account Settings ->
          # Security -> Access Tokens), not the account password.
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
